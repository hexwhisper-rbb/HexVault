
<section class="hv-archive" id="hexvault-archive">
  <div class="hv-header">
    <div>
      <p class="hv-eyebrow">HEXVAULT // PRIVATE ARCHIVE</p>
      <h2>Knowledge Vault</h2>
      <p class="hv-muted">Store your notes. Keep your secrets organized.</p>
    </div>
    <span class="hv-status">● LOCAL STORAGE</span>
  </div>

  <form id="hv-form" class="hv-form">
    <input type="hidden" id="hv-edit-id">

    <label for="hv-title">Entry title</label>
    <input id="hv-title" maxlength="120"
           placeholder="Enter archive title..." required>

    <label for="hv-category">Category</label>
    <select id="hv-category">
      <option value="General">General</option>
      <option value="Coding">Coding</option>
      <option value="Cybersecurity">Cybersecurity</option>
      <option value="Research">Research</option>
      <option value="Personal Notes">Personal Notes</option>
    </select>

    <label for="hv-content">Archive content</label>
    <textarea id="hv-content" rows="5" maxlength="20000"
      placeholder="Write your notes here..." required></textarea>

    <div class="hv-actions">
      <button type="submit" id="hv-save">+ Save Entry</button>
      <button type="button" id="hv-cancel" hidden>Cancel Edit</button>
    </div>
  </form>

  <div class="hv-toolbar">
    <input id="hv-search" type="search"
      placeholder="Search your archive...">

    <select id="hv-filter" aria-label="Filter archive category">
      <option value="All">All categories</option>
      <option value="General">General</option>
      <option value="Coding">Coding</option>
      <option value="Cybersecurity">Cybersecurity</option>
      <option value="Research">Research</option>
      <option value="Personal Notes">Personal Notes</option>
    </select>
  </div>

  <div class="hv-summary">
    <span id="hv-count">0 entries</span>
    <button type="button" id="hv-export">Export Backup</button>
    <button type="button" id="hv-import-button">Import Backup</button>
    <input type="file" id="hv-import-file"
      accept=".json,application/json" hidden>
  </div>

  <p id="hv-message" class="hv-message" role="status" aria-live="polite"></p>
  <div id="hv-list" class="hv-list"></div>
</section>
